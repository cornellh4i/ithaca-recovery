name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job's `yarn install` runs the `postinstall: prisma generate` script, and
# integration/e2e additionally run `prisma db push` directly — both are Prisma CLI
# invocations that ping checkpoint.prisma.io to check for updates after finishing.
# A stalled/rate-limited ping there leaves the CLI process alive indefinitely even
# though its actual work is done, hanging whatever awaited it. Confirmed happening
# to `db push` in CI (orphan `npm exec prisma db push` process on job cancellation,
# minutes after its own "schema applied" output had printed).
env:
  CHECKPOINT_DISABLE: "1"

defaults:
  run:
    working-directory: frontend

jobs:
  doc-freshness:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: .github/scripts/check-doc-versions.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      # mongodb-memory-server (used by both integration and e2e) downloads the
      # mongod binary on first use if it isn't already cached — caching it here
      # avoids re-downloading on every run and reduces exposure to a slow/rate-
      # limited download hanging the job (see e2e's cache step below, keyed the
      # same way).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      - run: yarn test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      # No GOOGLE_*/ZOOM_* secrets configured on this job, deliberately — the suite
      # is designed to run against the fail-soft sync-error paths with zero real
      # external API calls (see test/e2e/support/sync-fixtures.ts). global-setup.ts
      # also actively blanks any such vars it finds in a .env.local, but CI has no
      # .env.local at all, so there's nothing to blank in the first place.
      - run: yarn test:e2e
      # config/playwright.config.ts uses trace: "retain-on-failure" with the "list"
      # reporter (no HTML report generated) — traces land directly in
      # test-results/, which is what's worth keeping on a failed run.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

name: Test

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      # No GOOGLE_*/ZOOM_* secrets configured on this job, deliberately — the suite
      # is designed to run against the fail-soft sync-error paths with zero real
      # external API calls (see test/e2e/support/sync-fixtures.ts). global-setup.ts
      # also actively blanks any such vars it finds in a .env.local, but CI has no
      # .env.local at all, so there's nothing to blank in the first place.
      - run: yarn test:e2e
      # playwright.config.ts uses trace: "retain-on-failure" with the "list"
      # reporter (no HTML report generated) — traces land directly in
      # test-results/, which is what's worth keeping on a failed run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
